
{% extends 'shop/base.html' %}

{% block title %}Manage Product{% endblock %}

{% block content %}

<h2>
    {% if form.instance.pk %}
        Update Product
    {% else %}
        Create Product
    {% endif %}
</h2>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        Save Product
    </button>

    <a href="{% url 'product_list' %}"
       class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
