
{% extends 'shop/base.html' %}

{% block content %}

<h2>{{ product.name }}</h2>

{% if product.image %}
    <img src="{{ product.image.url }}"
         alt="{{ product.name }}"
         width="300">
{% endif %}

<p><strong>Price:</strong> ₹{{ product.price }}</p>

<p>{{ product.description }}</p>

<a href="/">Back to Products</a>

{% endblock %}
